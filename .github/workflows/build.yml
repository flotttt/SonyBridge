name: macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (release, universal)
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: SonyBridge-macOS
          path: build/SonyBridge.zip
